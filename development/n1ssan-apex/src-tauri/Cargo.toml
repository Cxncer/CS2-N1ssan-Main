[package]
name = "n1ssan-apex"
version = "0.1.0"
description = "N1ssan Sync - signature and offset checker for n1ssan"
authors = ["n1ssan"]
edition = "2021"
rust-version = "1.77"
default-run = "n1ssan-apex"

[lib]
name = "n1ssan_apex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
